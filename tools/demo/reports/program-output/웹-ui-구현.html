<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bloks-cli Web Interface</title>
    <style>
        body {
            background-color: #0f0f1a;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }
        .task-card {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            margin-bottom: 10px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.3s;
        }
        .task-card.todo { border-left: 5px solid #ff6347; }
        .task-card.inprogress { border-left: 5px solid #ffd700; }
        .task-card.done { border-left: 5px solid #32cd32; }
        .task-card:hover {
            background-color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
        }
        .task-form {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }
        .task-form input, .task-form select {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 4px;
            border: none;
        }
        .add-task-btn {
            background-color: #7c3aed;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .add-task-btn:hover {
            background-color: #5b25b3;
        }
        .delete-btn {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .delete-btn:hover {
            background-color: #cc0000;
        }
        .error-message, .loading-message {
            color: #ff6347;
            text-align: center;
            margin: 10px 0;
        }
        @media (max-width: 600px) {
            .task-card {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>bloks-cli Task Manager</h1>
        <div class="task-form">
            <input type="text" id="task-title" placeholder="Task Title" required>
            <input type="text" id="task-project" placeholder="Project" required>
            <select id="task-priority">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
            <button class="add-task-btn" onclick="addTask()">Add Task</button>
        </div>
        <div id="tasks-container"></div>
        <div class="error-message" id="error-message" style="display: none;">Error: Unable to connect to the server.</div>
        <div class="loading-message" id="loading-message" style="display: none;">Loading tasks...</div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/tasks';

        async function fetchTasks() {
            document.getElementById('loading-message').style.display = 'block';
            document.getElementById('error-message').style.display = 'none';

            try {
                const response = await fetch(API_URL);
                const tasks = await response.json();
                displayTasks(tasks);
            } catch (error) {
                document.getElementById('error-message').style.display = 'block';
            } finally {
                document.getElementById('loading-message').style.display = 'none';
            }
        }

        function displayTasks(tasks) {
            const tasksContainer = document.getElementById('tasks-container');
            tasksContainer.innerHTML = '';
            tasks.forEach(task => {
                const taskCard = document.createElement('div');
                taskCard.className = `task-card ${task.status.toLowerCase()}`;
                taskCard.innerHTML = `
                    <div>
                        <h3>${task.title}</h3>
                        <p>Project: ${task.project}</p>
                        <p>Priority: ${task.priority}</p>
                    </div>
                    <button class="delete-btn" onclick="deleteTask(${task.id}, event)">Delete</button>
                `;
                taskCard.onclick = () => toggleTaskStatus(task.id);
                tasksContainer.appendChild(taskCard);
            });
        }

        async function addTask() {
            const title = document.getElementById('task-title').value;
            const project = document.getElementById('task-project').value;
            const priority = document.getElementById('task-priority').value;

            const newTask = { title, project, priority, status: 'Todo' };

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newTask)
                });
                fetchTasks();
            } catch (error) {
                document.getElementById('error-message').style.display = 'block';
            }
        }

        async function toggleTaskStatus(taskId) {
            try {
                await fetch(`${API_URL}/${taskId}/toggle-status`, { method: 'PATCH' });
                fetchTasks();
            } catch (error) {
                document.getElementById('error-message').style.display = 'block';
            }
        }

        async function deleteTask(taskId, event) {
            event.stopPropagation();
            try {
                await fetch(`${API_URL}/${taskId}`, { method: 'DELETE' });
                fetchTasks();
            } catch (error) {
                document.getElementById('error-message').style.display = 'block';
            }
        }

        fetchTasks();
    </script>
</body>
</html>
