<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홈페이지 제목</title>
    <style>
body {
    font-family: 'Arial', sans-serif;
    line-height: 1.6;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

header {
    background-color: #333;
    color: #fff;
    padding: 10px 0;
}

nav ul {
    list-style: none;
    display: flex;
    justify-content: center;
    padding: 0;
}

nav ul li {
    margin: 0 15px;
}

nav ul li a {
    color: white;
    text-decoration: none;
}

main {
    padding: 20px;
}

section {
    margin-bottom: 40px;
}

footer {
    background-color: #333;
    color: #fff;
    text-align: center;
    padding: 10px 0;
}

@media (max-width: 768px) {
    nav ul {
        flex-direction: column;
    }
}
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#home">홈</a></li>
                <li><a href="#about">소개</a></li>
                <li><a href="#services">서비스</a></li>
                <li><a href="#contact">연락처</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="home">
            <h1>환영합니다!</h1>
            <p>우리 홈페이지에 오신 것을 환영합니다.</p>
        </section>
        <section id="about">
            <h2>소개</h2>
            <p>우리는 최고의 서비스를 제공합니다.</p>
        </section>
        <section id="services">
            <h2>서비스</h2>
            <p>다양한 서비스를 만나보세요.</p>
        </section>
        <section id="contact">
            <h2>연락처</h2>
            <p>문의 사항이 있으시면 연락주세요.</p>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 회사 이름. 모든 권리 보유.</p>
    </footer>
</body>
</html>
