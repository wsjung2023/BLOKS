name: Smoke

on:
  push:
    branches: ["main"]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "tools/e2e-board-smoke.mjs"
      - "tools/fixtures/**"
  schedule:
    - cron: "0 9 * * *"   # 매일 오전 9시 (KST 기준 UTC+9 = 00:00 UTC)
  workflow_dispatch:

jobs:
  board-smoke:
    name: Board smoke (fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Run board smoke (fixture mode)
        run: pnpm smoke:board:fixture

      - name: Create GitHub issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'smoke-failure',
              state: 'open',
            });
            if (existing.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '[smoke] board smoke 실패',
                body: `Board smoke 테스트가 실패했습니다.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                labels: ['smoke-failure'],
              });
            }
